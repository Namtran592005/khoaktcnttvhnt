services:
  db:
    image: mariadb:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql

  redis:
    image: redis:latest
    restart: unless-stopped
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    # Nội bộ hoàn toàn (không publish port): LSCache trong container wordpress kết nối thẳng redis:6379.
    # Ephemeral đúng bản chất object cache: restart là cache trắng.

  wordpress:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    # Nguồn sự thật duy nhất cho config WP. OLS không truyền env xuống LSPHP nên
    # ols-entrypoint.sh materialize các var này thành file putenv mỗi lúc start.
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') $$_SERVER['HTTPS'] = 'on';
        define('WP_HOME','https://${SITE_DOMAIN}');
        define('WP_SITEURL','https://${SITE_DOMAIN}');
        define('FORCE_SSL_ADMIN',true);
        define('FS_METHOD','direct');
    volumes:
      - ./wordpress:/var/www/vhosts/localhost/html
      - ./uploads.ini:/usr/local/lsws/lsphp84/etc/php/8.4/litespeed/conf.d/99-wordpress.ini:ro

  caddy:
    image: caddy:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
